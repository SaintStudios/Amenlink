<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="canonical" href="https://amen-app.com/">
    <title>Amen - Bible Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            color-scheme: light dark;
            --page: #ffffff;
            --surface: #f5f5f5;
            --ink: #1c1c1e;
            --muted: #636366;
            --line: rgba(0, 0, 0, 0.06);
        }

        body {
            min-height: 100vh;
            min-height: 100svh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding:
                max(160px, calc(env(safe-area-inset-top) + 140px))
                max(24px, env(safe-area-inset-right))
                max(32px, env(safe-area-inset-bottom))
                max(24px, env(safe-area-inset-left));
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
            overflow-wrap: break-word;
            background: var(--page);
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 1.0625rem;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        .app-icon {
            position: absolute;
            top: max(48px, calc(env(safe-area-inset-top) + 40px));
            left: 50%;
            transform: translateX(-50%);
            width: 76px;
            height: 76px;
            background-image: url('/amen-app-icon.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 19px;
        }

        .arrow {
            position: fixed;
            top: max(8px, calc(env(safe-area-inset-top) + 2px));
            right: max(2px, calc(env(safe-area-inset-right) + 2px));
            display: flex;
            width: 40px;
            height: 48px;
            align-items: center;
            justify-content: center;
            color: var(--ink);
            font-size: 40px;
            line-height: 1;
            opacity: 0.65;
            pointer-events: none;
        }

        .content {
            width: 100%;
            max-width: 360px;
            padding: 24px;
            border: 1px solid var(--line);
            border-radius: 20px;
            background: var(--surface);
            text-align: left;
        }

        .content h1 {
            margin-bottom: 16px;
            font-size: 1.375rem;
            font-weight: 600;
            line-height: 1.3;
            letter-spacing: -0.025em;
            overflow-wrap: break-word;
        }

        .steps {
            list-style: none;
        }

        .steps li {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 14px 0;
            color: var(--ink);
            font-size: 0.9375rem;
            font-weight: 400;
            line-height: 1.5;
        }

        .steps li + li {
            border-top: 1px solid var(--line);
        }

        .step-number {
            display: flex;
            width: 28px;
            min-height: 22px;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 0.9375rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .step-text {
            flex: 1;
            min-width: 0;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --page: #1c1c1e;
                --surface: #2c2c2e;
                --ink: #f5f5f7;
                --muted: #b0b0b4;
                --line: rgba(255, 255, 255, 0.06);
            }
        }
    </style>
</head>
<body class="fade-in">
    <div class="app-icon"></div>
    <div class="arrow">↑</div>
    
    <div class="content" id="instructions">
        <h1 id="title">Open in your browser</h1>
        <ul class="steps">
            <li>
                <div class="step-number">1</div>
                <div class="step-text">Tap the three-dot menu in the top right.</div>
            </li>
            <li>
                <div class="step-number">2</div>
                <div class="step-text">Choose “Open in browser”.</div>
            </li>
        </ul>
    </div>
    
    <script>
        // Keep older links on the same localized, platform-aware flow as the main page.
        window.location.replace('/' + window.location.search + window.location.hash);
    </script>
</body>
</html>
